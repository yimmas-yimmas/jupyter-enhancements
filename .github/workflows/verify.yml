name: TypeScript and notebook state tests
on:
  push:
    branches: [main, fix/notebook-animation-and-editing-142]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: node --test tests/*.test.cjs
